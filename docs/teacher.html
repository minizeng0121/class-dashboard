<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>班級經營儀表板（教師控制台）</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="app-bar">
  <span class="app-bar-title">班級經營儀表板・教師控制台</span>
  <a href="index.html" class="back-to-display-btn">↩ 投影畫面</a>
</header>

<!-- ===== 教師控制台 ===== -->
<div id="teacherScreen" class="screen">

  <div id="startScreen" class="page">
    <h1 class="page-title">開始課堂</h1>
    <p class="page-subtitle">資料會即時存進 Google Sheet，跨裝置共用同一份。</p>

    <div class="card">
      <label class="field">
        <span>選擇班級</span>
        <select id="classSelect"></select>
      </label>

      <label class="field">
        <span>小組數量</span>
        <input type="number" id="groupCount" min="1" max="8" value="5">
      </label>

      <button type="button" id="startBtn" class="btn btn-primary btn-block">開始本節課</button>
      <p class="field-error" id="startError" hidden>開課失敗，請確認網路連線後再試一次。</p>
    </div>
  </div>

  <div id="consoleScreen" class="screen page console-page" hidden>

    <header class="console-top">
      <div>
        <h1 id="className" class="page-title"></h1>
        <p id="startedAtText" class="page-subtitle"></p>
      </div>
      <div style="display:flex; align-items:center; gap:0.6rem;">
        <div class="sync-badge" id="syncBadge">已同步</div>
      </div>
    </header>

    <div class="sync-notice" id="syncNotice" hidden></div>

    <div class="console-grid">
      <section class="card lights-card">
        <h2 class="card-title">班級秩序</h2>

        <div class="teacher-preview" id="teacherPreview">
          <span class="dot-mini" id="previewDot"></span>
          <div>
            <p class="teacher-preview-label">學生現在看到</p>
            <p class="teacher-preview-text" id="previewText">尚未設定</p>
          </div>
        </div>

        <p class="card-subtitle mt">點一下記錄目前燈號</p>
        <div class="light-buttons">
          <button type="button" class="light-btn" data-color="green">
            <span class="dot dot-green"></span>綠燈
          </button>
          <button type="button" class="light-btn" data-color="yellow">
            <span class="dot dot-yellow"></span>黃燈
          </button>
          <button type="button" class="light-btn" data-color="red">
            <span class="dot dot-red"></span>紅燈
          </button>
        </div>

        <p class="card-subtitle mt">本節燈號紀錄（點一筆可更正）</p>
        <div class="light-history light-history-editable" id="lightHistory"></div>

        <div class="correct-picker" id="correctPicker" hidden>
          <p class="correct-hint" id="correctHint"></p>
          <div class="correct-picker-buttons">
            <button type="button" class="light-btn correct-btn" data-color="green">
              <span class="dot dot-green"></span>綠燈
            </button>
            <button type="button" class="light-btn correct-btn" data-color="yellow">
              <span class="dot dot-yellow"></span>黃燈
            </button>
            <button type="button" class="light-btn correct-btn" data-color="red">
              <span class="dot dot-red"></span>紅燈
            </button>
          </div>
        </div>
      </section>

      <section class="card groups-card">
        <h2 class="card-title">小組自主狀態</h2>
        <p class="card-subtitle">點第幾顆星，就直接設定第幾星；每組獨立增減 💡</p>
        <div class="groups-section" id="groupsSection"></div>
      </section>
    </div>

    <section class="card achievements-card">
      <h2 class="card-title">🎱 特殊表現</h2>
      <p class="card-subtitle">輸入座號，點選類型即可新增一顆球；點下方已加入的球可移除</p>
      <div class="ach-input-row">
        <input type="number" id="achSeatInput" min="1" max="99" placeholder="座號">
        <button type="button" id="achQuestionBtn" class="btn btn-secondary">🎱 好問題</button>
        <button type="button" id="achHelpBtn" class="btn btn-secondary">⚫ 幫助別人</button>
      </div>
      <div class="ach-track" id="achTrack"></div>
    </section>

    <div class="undo-bar" id="undoBar" hidden>
      <span id="undoText"></span>
      <button type="button" id="undoBtn" class="btn btn-small">復原</button>
    </div>

    <footer class="console-footer">
      <button type="button" id="endSessionBtn" class="btn btn-danger">結束課堂</button>
    </footer>
  </div>

</div>

<script src="js/config.js"></script>
<script src="js/store.js"></script>
<script src="js/render-shared.js"></script>
<script src="js/teacher.js"></script>
</body>
</html>
