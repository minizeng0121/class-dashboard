<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>班級經營儀表板（投影）</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="display-body">

<header class="app-bar">
  <span class="app-bar-title">班級經營儀表板</span>
</header>

<!-- ===== 學生前台（唯讀，投影用） ===== -->
<div id="displayScreen" class="screen">

  <div id="d-waitingState" class="display-state display-state-centered">
    <div class="card"><h1>等待課堂開始…</h1></div>
  </div>

  <div id="d-activeState" class="display-state display-page" hidden>
    <h1 class="d-class-name" id="d-className"></h1>

    <div class="display-grid">
      <section class="card light-card">
        <div class="current-light-hero">
          <span class="dot-big" id="d-lightDot"></span>
          <span class="light-text-big" id="d-lightText">尚未設定</span>
          <span class="light-text-sub" id="d-lightSub"></span>
        </div>
        <p class="card-subtitle mt">本節燈號紀錄</p>
        <div class="light-history light-history-big" id="d-lightHistory"></div>
      </section>

      <div class="display-main">
        <section class="help-flow-card">
          👂 先聽 → 👀 先看課本講義 → 🧪 先試 → 👥 互相幫忙 → 🙋 再找老師
        </section>

        <section class="card">
          <h2 class="card-title">小組自主狀態</h2>
          <div class="groups-display" id="d-groupsSection"></div>
        </section>
      </div>
    </div>

    <section class="card achievements-display-card">
      <h2 class="card-title">🎱 特殊表現</h2>
      <div class="ach-track" id="d-achTrack"></div>
    </section>

    <div class="sync-banner" id="d-syncBanner" hidden></div>
  </div>

  <div id="d-endedState" class="display-state display-state-centered" hidden>
    <div class="card">
      <h1>本節課已結束</h1>
      <p class="page-subtitle" style="margin-top:0.6rem;">等待老師開始下一堂課。</p>
    </div>
  </div>

</div>

<script src="js/config.js"></script>
<script src="js/store.js"></script>
<script src="js/render-shared.js"></script>
<script src="js/display.js"></script>
</body>
</html>
