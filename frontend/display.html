<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>學生前台（原型）</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="display-body">

<div id="waitingState" class="display-state display-state-centered">
  <div class="card"><h1>等待課堂開始…</h1></div>
</div>

<div id="activeState" class="display-state display-page" hidden>

  <section class="card">
    <h1 class="d-class-name" id="d-className"></h1>
    <div class="current-light-row">
      <span class="dot-big" id="d-lightDot"></span>
      <span class="light-text-big" id="d-lightText">尚未設定</span>
    </div>
    <p class="card-subtitle mt">本節燈號紀錄</p>
    <div class="light-history light-history-big" id="d-lightHistory"></div>
  </section>

  <section class="card">
    <h2 class="card-title">小組自主狀態</h2>
    <div class="groups-display" id="d-groupsSection"></div>
  </section>

  <section class="help-flow-card">
    👀 先看 → 🧪 先試 → 👥 互相幫忙 → 🙋 再找老師
  </section>

  <div class="sync-banner" id="d-syncBanner" hidden></div>
</div>

<div id="endedState" class="display-state display-state-centered" hidden>
  <div class="card"><h1>本節課已結束</h1></div>
</div>

<script src="js/store.js"></script>
<script src="js/display.js"></script>
</body>
</html>
